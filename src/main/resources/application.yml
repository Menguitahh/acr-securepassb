spring:
  application:
    name: securepassb
  # securepassb#257: JPA convive con JdbcClient. Flyway crea el esquema;
  # Hibernate solo valida que las @Entity coincidan con las tablas.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securepass}
    username: ${DB_USER:securepass}
    password: ${DB_PASSWORD:securepass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

securepass:
  jwt:
    secret: ${SECUREPASS_JWT_SECRET}
    ttl-seconds: ${SECUREPASS_JWT_TTL_SECONDS:900}
  refresh:
    ttl-days: ${SECUREPASS_REFRESH_TTL_DAYS:30}
  master-key: ${SECUREPASS_MASTER_KEY}
  export:
    # #189: cada export CSV retiene una conexion de Hikari (default 10) mientras
    # el cliente descarga. Mantener en ~20% del pool; revisar si se agranda.
    max-concurrent: ${SECUREPASS_EXPORT_MAX_CONCURRENT:2}
    # #195: tope del XLSX, medido (500k = ~11,5 s de conexion y ~260 MB de
    # temporal por export). Maximo 1048575 (Excel). El temporal escala con
    # max-concurrent: reservar xlsx-max-rows x max-concurrent x 520 B en
    # java.io.tmpdir (en tmpfs es RAM).
    xlsx-max-rows: ${SECUREPASS_EXPORT_XLSX_MAX_ROWS:500000}
  cors:
    allowed-origins: ${SECUREPASS_CORS_ALLOWED_ORIGINS:https://admin.securepass.app}
  push:
    provider: ${SECUREPASS_PUSH_PROVIDER:logging}
    expo:
      url: ${SECUREPASS_EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
      access-token: ${SECUREPASS_EXPO_ACCESS_TOKEN:}
  email:
    provider: ${SECUREPASS_EMAIL_PROVIDER:logging}
    from: ${SECUREPASS_EMAIL_FROM:Securepass <no-reply@securepass.app>}
    resend:
      url: ${SECUREPASS_RESEND_URL:https://api.resend.com/emails}
      api-key: ${RESEND_API_KEY:}
  activation:
    base-url: ${SECUREPASS_ACTIVATION_BASE_URL:http://localhost:8080}
    ttl-days: ${SECUREPASS_ACTIVATION_TTL_DAYS:7}
  password-reset:
    ttl-hours: ${SECUREPASS_PASSWORD_RESET_TTL_HOURS:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: securepassb
