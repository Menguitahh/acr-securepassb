spring:
  # securepassb#257: JPA convive con JdbcClient. Flyway crea el esquema;
  # Hibernate solo valida que las @Entity coincidan con las tablas.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  health:
    redis:
      enabled: false

securepass:
  jwt:
    secret: test-secret-that-is-long-enough-to-pass-hmac-32-byte-check
    ttl-seconds: 900
  refresh:
    ttl-days: 30
  master-key: REVWX09OTFlfS0VZXzMyX0JZVEVTX1hYWFhYWFhYWFg=
